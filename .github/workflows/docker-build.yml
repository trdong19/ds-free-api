name: Build and Push Docker Image

# 触发条件：推送 tag（例如 v1.0.0）时自动构建，或者手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io          # 使用 GitHub 自带的镜像仓库
  IMAGE_NAME: ${{ github.repository }}  # 镜像名自动为 用户名/仓库名

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 允许推送镜像到 GitHub Packages

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 设置 QEMU 模拟，以便构建 arm64 镜像（虽然在本机构建，但最终推送的镜像标记为 arm64 时需要）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx，支持多平台构建
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送镜像
      - name: 构建并推送 (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64   # 只构建 arm64，因为你需要这个架构
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
